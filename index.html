.match{padding:15px 16px;border-bottom:1px solid #252e38}.match:last-child{border:0}.matchtop{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:12px}.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.versus .team:last-child{text-align:right}.team{font-weight:850;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{background:#c6ff00;color:#101500;border-radius:99px;padding:8px 13px;font-weight:1000;min-width:64px;text-align:center}.pending{background:#202833;color:#dbe2eb}

.tablewrap{overflow:auto}.ratingtable{width:100%;border-collapse:collapse;min-width:520px}.ratingtable th,.ratingtable td{padding:14px 12px;text-align:right;border-bottom:1px solid #28313b;font-size:13px}.ratingtable th{color:var(--muted);font-size:10px;letter-spacing:1px}.ratingtable th:nth-child(2),.ratingtable td:nth-child(2){text-align:left}.ratingtable td strong{color:var(--lime);font-size:17px}

/* ===== CLASH ROYALE INSPIRED THEME ===== */
:root{
  --bg:#071c42;
  --panel:#123d79;
  --panel2:#0b2b5d;
  --line:#4b9fe7;
  --muted:#c3dcf5;
  --text:#fffdf2;
  --lime:#ffd33d;
  --lime2:#f39b16;
  --red:#f04462;
  --blue:#36b9ff;
  --gold:#ffd33d;
}
body{
  background:
    radial-gradient(ellipse at 50% 0%,#4b9fe8 0%,#1764ad 30%,transparent 62%),
    repeating-linear-gradient(45deg,#0d3970 0,#0d3970 24px,#10427e 24px,#10427e 48px);
  background-color:#082654;
  color:#fffdf2;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    linear-gradient(135deg,#ffffff0d 25%,transparent 25%) 0 0/48px 48px,
    linear-gradient(315deg,#00000012 25%,transparent 25%) 0 0/48px 48px;
}
.top{
  background:linear-gradient(180deg,#09285c 0%,#061a3d 100%);
  border-bottom:4px solid #f6bd32;
  box-shadow:0 5px 0 #09234b,0 10px 25px #00112e88;
}
.logo{
  background:linear-gradient(145deg,#fff17b,#ffb51e 60%,#d87508);
  color:#713800;border:3px solid #fff0a0;border-radius:16px;
  box-shadow:inset 0 3px 0 #fff8c9,0 4px 0 #9b5107,0 7px 12px #001a3d88;
  text-shadow:0 1px #fff6;
}
.brandname{
  color:#fff;text-shadow:0 3px 0 #17386a,0 5px 0 #071a3b;
  letter-spacing:-.5px;
}
.sub{color:#d9eaff;text-shadow:0 1px 2px #001a3d}
.pill{
  color:#fff;background:linear-gradient(#327ed0,#1453a0);
  border:2px solid #8ed4ff;border-radius:10px;
  box-shadow:inset 0 2px 0 #ffffff55,0 3px 0 #082c61;
}
.adminbtn{
  color:#fff;background:linear-gradient(#347fc9,#15529a);
  border:2px solid #8bcfff;border-radius:12px;
  box-shadow:inset 0 2px 0 #ffffff55,0 3px 0 #08264e;
}
main{ text-shadow:0 1px 1px #001a3b }
.eyebrow{
  color:#ffe16a;letter-spacing:3px;
  text-shadow:0 2px 0 #79470b;
}
.heading h1{
  color:#fff;text-shadow:0 3px 0 #1a4d86,0 5px 0 #08234b;
  letter-spacing:-1px;
}
.count{color:#e3f2ff;text-shadow:0 1px 2px #001a3b}
.nav{
  background:linear-gradient(180deg,#245b9a,#0a2a5b);
  border-top:4px solid #75c8ff;
  box-shadow:0 -5px 0 #08224a,0 -12px 25px #00112e88;
}
.nav button{
  color:#c1d9f2;border-radius:12px;
  text-shadow:0 2px 1px #001a3b;
}
.nav button.active{
  color:#fff;background:linear-gradient(180deg,#ffe879 0%,#ffb72d 48%,#e47a13 100%);
  border:2px solid #fff0a2;
  box-shadow:inset 0 3px 0 #ffffff99,0 3px 0 #8e4509,0 5px 9px #001a3d88;
  text-shadow:0 2px 0 #8e4509;
}
.panel{
  background:linear-gradient(155deg,#276bb0 0%,#124783 40%,#0b2e62 100%);
  border:3px solid #75caff;border-radius:20px;
  box-shadow:inset 0 2px 0 #ffffff55,0 5px 0 #082653,0 10px 22px #00173577;
}
.panelhead{
  color:#fff;background:linear-gradient(180deg,#1d5b9f,#12417c);
  border-bottom:2px solid #6bbfff;text-shadow:0 2px 0 #082653;
}
.rowitem,.match,.statline{
  border-bottom:1px solid #77b9ed55;
}
.rowitem:first-child .rank{
  background:linear-gradient(#fff18a,#ffb72d);color:#75400b;
  border:2px solid #fff3a5;box-shadow:0 2px 0 #99520b;
}
.rank{
  background:linear-gradient(#76bde9,#2873b9);color:white;
  border:1px solid #a9ddff;box-shadow:0 2px 0 #082b59;
}
.points,.statbig,.statline .value{
  color:#ffe36a;text-shadow:0 2px 0 #86500b;
}
.stagebar button,.subtabs button{
  color:#e6f4ff;background:linear-gradient(#347fc4,#155093);
  border:2px solid #75c7ff;border-radius:12px;
  box-shadow:inset 0 2px 0 #ffffff55,0 3px 0 #08264e;
  text-shadow:0 1px 1px #082653;
}
.stagebar button.active,.subtabs button.active{
  color:#75400b;background:linear-gradient(#fff08a,#ffc32e 55%,#ed8b12);
  border:2px solid #fff0a0;
  box-shadow:inset 0 2px 0 #ffffffaa,0 3px 0 #9a4d08;
  text-shadow:0 1px #fff6;
}
.playercard{
  background:
    linear-gradient(145deg,#286db0dd,#0b3269ee),
    repeating-linear-gradient(135deg,#174c87 0,#174c87 12px,#103d74 12px,#103d74 24px);
  border:3px solid #83d0ff;border-radius:18px;
  box-shadow:inset 0 2px 0 #ffffff66,0 4px 0 #082653,0 7px 14px #00173577;
}
.playercard .num{color:#ffe36a;text-shadow:0 2px 0 #75400b}
.playercard h3{color:#fff;text-shadow:0 2px 0 #0a2b58}
.playercard p,.small{color:#d3e8fb}
.score{
  color:#713900;background:linear-gradient(#fff18a,#ffc52d 55%,#e98b12);
  border:2px solid #fff2a0;box-shadow:inset 0 2px 0 #ffffffaa,0 3px 0 #984b08;
  text-shadow:0 1px 0 #fff8;
}
.score.pending{
  color:#fff;background:linear-gradient(#4d85bc,#23548d);
  border:2px solid #9bd8ff;box-shadow:0 3px 0 #082653;
}
.ratingtable th{color:#ffe16a;text-shadow:0 1px 1px #082653}
.ratingtable td{border-bottom:1px solid #78b9e955}
.ratingtable td strong{color:#ffe36a;text-shadow:0 2px 0 #86500b}
.sheet{
  background:linear-gradient(155deg,#286db0,#0b2d60);
  border:3px solid #8bd3ff;color:#fff;
  box-shadow:inset 0 2px 0 #ffffff66,0 8px 0 #061d42,0 20px 60px #000b;
}
.sheet h2{color:#fff;text-shadow:0 3px 0 #0a2a59}
.field label{color:#e0f1ff}
.field input,.field select{
  color:#fff;background:#092958;border:2px solid #65b7f0;
  border-radius:10px;box-shadow:inset 0 2px 5px #001b3d88;
}
.field input:focus{border-color:#ffe16a}
.primary{
  color:#713900;background:linear-gradient(#fff18a,#ffc32d 55%,#e77d0e);
  border:2px solid #fff0a0;border-radius:12px;
  box-shadow:inset 0 2px 0 #ffffffaa,0 4px 0 #914808;
  text-shadow:0 1px #fff8;
}
.secondary{
  color:#fff;background:linear-gradient(#347fc4,#155093);
  border:2px solid #82ceff;border-radius:12px;
  box-shadow:inset 0 2px 0 #ffffff55,0 4px 0 #08264e;
}
.secondary.danger{color:#fff;background:linear-gradient(#f56a7d,#bb203d);border-color:#ffabb7;box-shadow:0 4px 0 #72142b}
.hint{color:#d0e7fb}
.empty{color:#d0e7fb}
@media(max-width:699px){
  .top{padding-top:16px}
  .nav{padding-top:8px}
}


/* Inline developer workspace */
.gearbtn{width:38px;height:38px;padding:0!important;display:grid;place-items:center;font-size:21px!important;border-radius:50%!important;flex:0 0 auto}
.topright{display:flex;align-items:center;gap:8px}
.admin-workspace{margin:22px 0 30px;padding:14px;background:linear-gradient(160deg,#174f91,#0b2d61);border:3px solid #83d2ff;border-radius:20px;box-shadow:inset 0 2px 0 #ffffff55,0 5px 0 #082653}
.admin-workspace h2{font-size:18px;margin:0 0 5px;color:#fff;text-shadow:0 2px #092b59}
.admin-tabs{display:flex;gap:7px;overflow-x:auto;padding:10px 0 13px}
.admin-tabs button{white-space:nowrap;padding:9px 12px;border-radius:10px;border:2px solid #77caff;background:linear-gradient(#347fc4,#155093);color:#fff;font-weight:900;font-size:11px}
.admin-tabs button.active{background:linear-gradient(#fff08a,#ffc32d 55%,#ed8b12);color:#713900;border-color:#fff0a0}
.admin-content{background:#09295888;border:1px solid #72bff0;border-radius:14px;padding:12px}
.admin-content .adminsection{border-color:#7bbce655}
.admin-content .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.admin-content .field{min-width:0}
.admin-content input,.admin-content select{box-sizing:border-box;min-width:0}
.admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.admin-toolbar .hint{margin:0}
.admin-workspace .actions{margin-top:12px}
.admin-workspace .secondary,.admin-workspace .primary{font-size:12px}
.admin-round-tools{display:flex;gap:8px;flex-wrap:wrap}
.admin-round-tools .field{flex:1;min-width:150px}
@media(max-width:420px){.admin-content .formgrid{grid-template-columns:1fr}.admin-workspace{padding:10px}.gearbtn{width:34px;height:34px}}



/* Exact silhouettes extracted from the four user-supplied icon images */
.nav .ico{display:flex;align-items:center;justify-content:center;height:36px;margin:0 0 5px;font-size:0;line-height:1}
.nav .ico-mask{display:block;width:31px;height:31px;background:linear-gradient(180deg,#d8edff,#83b9ed);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;filter:drop-shadow(0 2px 1px #00152f88)}
.nav button.active .ico-mask{background:linear-gradient(180deg,#fff5a6,#ffd04b 55%,#e98b19);filter:drop-shadow(0 1px 1px #8d4b08)}
.nav .nav-label{display:block}
@media(max-width:390px){.nav .ico-mask{width:28px;height:28px}.nav .ico{height:33px}}



/* Compact tournament header */
.top{padding:17px 18px 15px}
.brand{gap:10px;min-height:48px}
.brandtitle{min-width:0}
.brandname{font-size:25px;line-height:1.08;letter-spacing:-.55px;color:#f5f7fa;white-space:normal}
.sub{font-size:13px;margin-top:5px;color:#91a0b4}
.topright{margin-left:auto;flex:0 0 auto}
.gearbtn{width:40px;height:40px;padding:0!important;display:grid;place-items:center;border-radius:12px!important;font-size:22px!important;color:#b9d8f5!important;background:linear-gradient(180deg,#1b2a3a,#101a27)!important;border:1px solid #38516a!important;box-shadow:inset 0 1px 0 #ffffff18,0 2px 5px #0005}
.gearbtn:hover{color:#e1f1ff!important;border-color:#7198bd!important;background:linear-gradient(180deg,#243c54,#142538)!important}


/* ===== STATISTICS: sections, leader card, Evolution frame ===== */
.statsec{margin-bottom:18px}
.statsec .panelhead{letter-spacing:2px}
.allbtn{background:transparent;border:0;color:#ffe36a;font-weight:900;font-size:13px;letter-spacing:.5px;padding:4px 2px;text-shadow:0 2px 0 #86500b;display:flex;align-items:center;gap:4px}
.allbtn:active{opacity:.7}
.leader{margin:14px;border:2px solid #6bbfff88;border-radius:18px;background:linear-gradient(160deg,#0f3769cc,#0a2650dd);overflow:hidden}
.leader-top{padding:12px 16px;border-bottom:1px solid #6bbfff55;color:#fff;font-size:14px;font-weight:900;letter-spacing:.5px;text-shadow:0 2px 0 #082653}
.leader-body{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 18px}
.leader-who{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:0;max-width:55%}
.leader-name{font-size:17px;font-weight:850;line-height:1.2;color:#fff;overflow-wrap:anywhere}
.leader-val{text-align:right;min-width:0}
.leader-num{font-size:clamp(52px,16vw,84px);line-height:.95;letter-spacing:-2px}
.leader-val .small{margin-top:6px;overflow-wrap:anywhere}
.statsec .statline .pname{flex:1;min-width:0}
.statsec .statline>div:nth-child(2){min-width:0;flex:1}

/* Evolution frame (skewed purple crystal) */
.evo{position:relative;width:104px;height:116px;flex:0 0 auto;filter:drop-shadow(0 0 7px #c06bff) drop-shadow(0 0 16px #7b2cff99)}
.evo-edge,.evo-in,.evo-glow{position:absolute;clip-path:polygon(3% 20%,6% 15%,96% 0,100% 5%,100% 8%,84% 94%,80% 100%,20% 93%,16% 90%)}
.evo-edge{inset:0;background:linear-gradient(135deg,#f6e4ff 0%,#c77dff 28%,#8a35ff 55%,#d9a6ff 80%,#fff0ff 100%)}
.evo-in{inset:5px;background:radial-gradient(circle at 25% 20%,#6a2fc8 0,#341074 55%,#1d0a4a 100%);overflow:hidden;display:grid;place-items:center}
.evo-in:before{content:"";position:absolute;inset:0;background:
 radial-gradient(1.5px 1.5px at 18% 30%,#fff 50%,transparent 51%),
 radial-gradient(1px 1px at 70% 18%,#fff 50%,transparent 51%),
 radial-gradient(1.5px 1.5px at 82% 62%,#e9d1ff 50%,transparent 51%),
 radial-gradient(1px 1px at 35% 80%,#fff 50%,transparent 51%),
 radial-gradient(1px 1px at 55% 50%,#e9d1ff 50%,transparent 51%);opacity:.9}
.evo-in img{position:relative;width:100%;height:100%;object-fit:cover;display:block}
.evo-ph{position:relative;font-size:46px;font-weight:1000;color:#f1dcff;text-shadow:0 0 12px #c06bff,0 3px 0 #2a0b66}
.evo-glow{inset:5px;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,#b45cff66 100%),linear-gradient(160deg,#ffffff40 0,transparent 28%)}
.evo-glow:after{content:""}

/* admin photo field */
.photo-field{grid-column:1/-1}
.photorow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photothumb{width:48px;height:54px;flex:0 0 auto;display:grid;place-items:center;overflow:hidden;background:#341074;border:2px solid #c77dff;border-radius:8px;color:#f1dcff;font-weight:1000;font-size:20px}
.photothumb img{width:100%;height:100%;object-fit:cover}
.photobtn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;font-size:12px;font-weight:900;cursor:pointer}


/* ===== header logo ===== */
.brandlogo{height:46px;width:auto;flex:0 0 auto;display:block;filter:drop-shadow(0 2px 0 #8d4b08) drop-shadow(0 3px 6px #00112e88)}

/* ===== players cards ===== */
.playercard .nick{color:#ffe36a;font-size:16px;font-weight:900;letter-spacing:.2px;text-shadow:0 2px 0 #75400b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playercard h3{margin:6px 0 6px}

/* ===== developer mode: inline editing ===== */
.editbanner{display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:11px 14px;border:2px dashed #ffe36a;border-radius:14px;background:#ffd33d1f;color:#fff3b0;font-size:13px;font-weight:700;line-height:1.35;text-shadow:none}
.editbanner .pen{color:#ffe36a;font-size:16px;line-height:1.2}
.ed-wrap{position:relative;display:block}
.ed-wrap:after{content:"✎";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#ffe36a;font-size:13px;pointer-events:none}
.ed-wrap.sel:after{display:none}
.ed{width:100%;min-width:0;box-sizing:border-box;color:#fff;background:#0a2a5a99;border:2px dashed #ffe36a;border-radius:10px;padding:9px 28px 9px 10px;font:inherit;font-weight:800;text-shadow:none;outline:none;box-shadow:inset 0 2px 5px #001b3d88}
select.ed{padding-right:10px}
.ed:focus{border-style:solid;background:#0a2a5a;box-shadow:0 0 0 3px #ffe36a55}
.ed.gold{color:#ffe36a}
.ed.sm{width:86px}
.ed.score{text-align:center;padding:9px 6px}
.ed option{color:#fff;background:#0a2a5a}
.ed[type=number]{-moz-appearance:textfield}
.ed[type=number]::-webkit-outer-spin-button,.ed[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ed-wrap.scorew:after{display:none}
.ed-wrap.inl{display:inline-block}
.playercard.editing{display:flex;flex-direction:column;gap:8px}
.playercard.editing p{margin:2px 0 0}
.photoedit{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.photoedit .small{margin:0;flex:1 1 70px;line-height:1.2}
.phbtn{position:relative;cursor:pointer;display:block}
.photothumb{width:46px;height:52px;display:grid;place-items:center;overflow:hidden;background:#341074;border:2px dashed #ffe36a;border-radius:8px;color:#f1dcff;font-weight:1000;font-size:20px;text-shadow:none}
.photothumb img{width:100%;height:100%;object-fit:cover;display:block}
.phpen{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#ffd33d;color:#713900;font-size:11px;border:2px solid #fff3a5;text-shadow:none}
.phdel{width:26px;height:26px;border-radius:50%;border:2px solid #ffabb7;background:linear-gradient(#f56a7d,#bb203d);color:#fff;font-size:11px;font-weight:900;padding:0;line-height:1}
.matchedit{padding:12px 14px}
.edlabel{color:#e0f1ff;font-size:11px;font-weight:900;letter-spacing:1px;margin:0 0 6px;text-shadow:none}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.mrow .vs{align-self:center;font-weight:1000;color:#ffe36a;font-size:12px}
.mside{display:flex;flex-direction:column;gap:8px;min-width:0}
.mini{padding:6px 10px!important;font-size:11px!important;border-radius:10px!important}
.addmatch{width:100%}
.edrow{gap:10px}
.edrow>div:first-child{flex:1;min-width:0}
.edgroup{display:flex;gap:8px;flex:0 0 auto;width:min(62%,300px)}
.edgroup.narrow{width:110px}
.edgroup .ed-wrap:first-child{flex:1;min-width:0}
.edgroup .ed-wrap+.ed-wrap{flex:0 0 84px}
.settingsbody{padding:14px 16px}
.settingsbody .hint{margin:12px 0 0}

/* floating save bar */
.adminbar{display:none;position:fixed;z-index:12;left:12px;right:12px;bottom:calc(104px + env(safe-area-inset-bottom));max-width:1026px;margin:0 auto;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(180deg,#245b9a,#0a2a5b);border:3px solid #ffe36a;border-radius:16px;box-shadow:0 5px 0 #082653,0 10px 22px #00173599}
body.admin .adminbar{display:flex}
.adminbar-msg{flex:1;min-width:0;font-size:12px;font-weight:900;color:#fff3b0;letter-spacing:.3px;text-shadow:0 1px 2px #001a3b}
.adminbar-msg.ok{color:#8dffa8}
.adminbar.dirty .adminbar-msg{color:#ffd33d}
.adminbar .primary,.adminbar .secondary{padding:10px 14px;font-size:12px;white-space:nowrap}
body.admin main{padding-bottom:200px}
@media(min-width:700px){.adminbar{bottom:18px}}


/* ===== TABLE: round switcher + Swiss groups ===== */
.roundnav{display:flex;align-items:center;gap:8px;margin:4px 0 18px;padding:6px;border-radius:16px;background:linear-gradient(180deg,#2a74bd,#154585);border:3px solid #7fc8ff;box-shadow:inset 0 2px 0 #ffffff44,0 4px 0 #082653,0 8px 16px #00173577}
.rn-label{flex:1;min-width:0;text-align:center;font-size:19px;font-weight:1000;letter-spacing:1.5px;line-height:1.1;color:#fff;text-shadow:0 2px 0 #082653;text-transform:uppercase;user-select:none}
.rn-label.long{font-size:15px;letter-spacing:.6px}
.rn-arrow{width:54px;height:46px;flex:0 0 auto;display:grid;place-items:center;padding:0;border:2px solid #b9e2ff;border-radius:12px;background:linear-gradient(#5ab0f5,#1f6fc0);color:#fff;box-shadow:inset 0 2px 0 #ffffff66,0 3px 0 #08264e}
.rn-arrow svg{width:22px;height:22px;display:block}
.rn-arrow:active{transform:translateY(2px);box-shadow:inset 0 2px 0 #ffffff66,0 1px 0 #08264e}
.rn-arrow:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.grp{margin-bottom:18px}
.grp .panelhead{padding:12px 18px}
.grp .rec{font-size:26px;line-height:1;font-weight:1000;letter-spacing:1px;color:#ffe36a;text-shadow:0 2px 0 #86500b}
.grp .grouptag{font-size:11px;letter-spacing:1.5px;color:#d7ebff}
.pair{padding:13px 16px}
.versus .team.win{color:#ffe36a}
.listrow{padding:15px 18px;border-bottom:1px solid #77b9ed55;font-weight:850;font-size:16px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listrow:last-child{border-bottom:0}
.listrow.edit{padding:10px 14px;overflow:visible}
.panel.gold{border:3px solid #ffd33d;box-shadow:inset 0 2px 0 #fff3a566,0 5px 0 #8a5206,0 10px 26px #ffc83d55}
.panel.gold .panelhead{background:linear-gradient(180deg,#7a5c10,#4a370a);border-bottom:2px solid #ffd33d99}
.panel.gold .grouptag{color:#ffe36a}
.panel.red{border:3px solid #ff5470;box-shadow:inset 0 2px 0 #ffc2cb55,0 5px 0 #6d1428,0 10px 26px #ff405d55}
.panel.red .panelhead{background:linear-gradient(180deg,#7d2236,#4a1020);border-bottom:2px solid #ff547099}
.panel.red .rec{color:#ff9aab;text-shadow:0 2px 0 #5a1020}
.panel.red .grouptag{color:#ffb3bf}

.grp .rec.txt{font-size:19px;letter-spacing:.6px}

/* wins / crowns / bans */
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.two .edlabel{margin-bottom:4px}
.mside .edlabel{font-size:10px;margin:2px 0 0}
.ed.wins{text-align:center;text-align-last:center;padding:9px 4px}
.ed.cardsel{font-size:12px;padding:8px 6px;text-overflow:ellipsis}
.crownsline{text-align:center;margin-top:8px;font-size:12px;font-weight:800;color:#d3e8fb}
.banrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.banside{min-width:0}
.banlbl{font-size:9px;font-weight:900;letter-spacing:1.5px;color:#ff9aab;margin-bottom:4px}
.banside.r{text-align:right}
.banside .chips{display:flex;flex-wrap:wrap;gap:4px}
.banside.r .chips{justify-content:flex-end}
.chip{font-size:11px;font-weight:800;line-height:1.15;padding:3px 8px;border-radius:999px;background:#ff547030;border:1px solid #ff8da28c;color:#ffd5dc}
.evo-ph svg{width:54px;height:54px;display:block}
.subtabs button{padding-left:12px;padding-right:12px}
.subtabs{gap:6px}
.subtabs button{padding-left:9px;padding-right:9px;font-size:11px;letter-spacing:0}
</style>
</head>

const CARDS=["Лучницы", "Стрелы", "Огненный шар", "Гигант", "Рыцарь", "Мини-П.Е.К.К.А.", "Миньоны", "Мушкетёр", "Хижина гоблинов", "Гоблины", "Гоблины-копейщики", "Подрывник", "Скелеты", "Надгробие", "Валькирия", "Варвары", "Пушка", "Башня-бомбёжка", "Адская башня", "Колдун", "Всадник на кабане", "Мортира", "Ракета", "Разряд", "Дракончик", "Гоблинская бочка", "П.Е.К.К.А.", "Армия скелетов", "Ведьма", "Шар", "Принц", "Заморозка", "Гигантский скелет", "Молния", "Хижина варваров", "Голем", "Орда миньонов", "Тесла", "Арбалет", "Ярость", "Сборщик эликсира", "Зеркало", "Тёмный принц", "Королевский гигант", "Три мушкетёра", "Яд", "Принцесса", "Ледяной колдун", "Огненный дух", "Стражи", "Печь", "Шахтёр", "Спарки", "Адская гончая", "Ледяной дух", "Бревно", "Вышибала", "Дровосек", "Мегаминьон", "Пламенный дракон", "Ледяной голем", "Кладбище", "Торнадо", "Элитные варвары", "Клон", "Громовержец", "Гоблин с дротиками", "Палач", "Боевой таран", "Банда гоблинов", "Бандитка", "Ночная ведьма", "Летучие мыши", "Повозка с пушкой", "Мегарыцарь", "Летучка", "Бочка со скелетами", "Охотник", "Мини-генераторы", "Королевский призрак", "Магический лучник", "Варварская бочка", "Разбойники", "Королевские кабаны", "Гигантский снежок", "Королевские рекруты", "Гоблин-гигант", "Электродракон", "Всадница на баране", "Стенобои", "Землетрясение", "Гоблин в клетке", "Рыбак", "Эликсирный голем", "Целительница-воин", "Огненная лучница", "Дух исцеления", "Королевская почта", "Костяные драконы", "Электрический дух", "Электрогигант", "Ведьмина бабушка", "Гоблинский бур", "Золотой рыцарь", "Король скелетов", "Королева лучниц", "Шустрый шахтёр", "Феникс", "Монах", "Маленький принц", "Бездна", "Гоблин-подрывник", "Проклятие гоблинов", "Гоблинская машина", "Подозрительный куст", "Гоблинштейн", "Руническая гигантша", "Берсеркша", "Главная бандитка", "Императрица духов", "Лоза", "Ронин", "Миньон-гигант"];
const CARDS_SORTED=[...CARDS].sort((a,b)=>a.localeCompare(b,"ru"));
const blankPair=()=>({a:0,b:0,wa:'',wb:'',sa:'',sb:'',ba:['','',''],bb:['','','']});
const fixPair=m=>{['wa','wb','sa','sb'].forEach(k=>{if(m[k]==null)m[k]=''});['ba','bb'].forEach(k=>{if(!Array.isArray(m[k]))m[k]=['','',''];while(m[k].length<3)m[k].push('')})};
const pairWinner=m=>{const ok=v=>v!==''&&v!=null;if(!ok(m.wa)||!ok(m.wb))return'';const x=+m.wa,y=+m.wb;return x===2&&y<2?'a':y===2&&x<2?'b':''};
const SWISS_STRUCT=[
 [{rec:'0:0',pairs:8}],
 [{rec:'1:0',pairs:4},{rec:'0:1',pairs:4}],
 [{rec:'2:0',pairs:2},{rec:'1:1',pairs:4},{rec:'0:2',pairs:2}],
 [{rec:'3:0',list:2,kind:'gold'},{rec:'2:1',pairs:3},{rec:'1:2',pairs:3},{rec:'0:3',list:2,kind:'red'}],
 [{rec:'3:1',list:3,kind:'gold'},{rec:'2:2',pairs:3},{rec:'1:3',list:3,kind:'red'}],
 [{rec:'3:2',list:3,kind:'gold'},{rec:'2:3',list:3,kind:'red'}],
 [{rec:'1/4 ФИНАЛА',pairs:4}],
 [{rec:'1/2 ФИНАЛА',pairs:2}],
 [{rec:'3-Е МЕСТО',pairs:1}],
 [{rec:'ФИНАЛ',pairs:1}]
];
const ROUND_LABELS=['1 РАУНД','2 РАУНД','3 РАУНД','4 РАУНД','5 РАУНД','6 РАУНД','ЧЕТВЕРТЬФИНАЛ','ПОЛУФИНАЛ','МАТЧ ЗА 3-Е МЕСТО','ФИНАЛ'];
const defaultSwiss=()=>SWISS_STRUCT.map(r=>r.map(g=>g.pairs?{rec:g.rec,pairs:Array.from({length:g.pairs},blankPair)}:{rec:g.rec,kind:g.kind,list:Array(g.list).fill(0)}));
const ensure=d=>{const def=defaultSwiss();if(!Array.isArray(d.swiss))d.swiss=def;else for(let i=d.swiss.length;i<def.length;i++)d.swiss.push(def[i]);d.swiss.flat().forEach(g=>g.pairs&&g.pairs.forEach(fixPair));return d};
let data;try{data=ensure(JSON.parse(localStorage.getItem(KEY))||defaults())}catch{data=ensure(defaults())}
let isAdmin=false,activeTab='table',dirty=false;
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const player=id=>data.players.find(p=>p.id===Number(id));
const totalWins=id=>data.swiss.flat().flatMap(g=>g.pairs||[]).filter(m=>{const w=pairWinner(m);return w&&m[w]==id}).length;
function title(eyebrow,heading,right=''){return `<div class="heading"><div>${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${heading}</h1></div><div class="count">${right}</div></div>`}
const load=()=>{try{return ensure(JSON.parse(localStorage.getItem(KEY))||defaults())}catch{return ensure(defaults())}};
const nickOf=p=>p.nick||`Никнейм ${p.id}`;
const initial=n=>{const t=String(n||'').trim();return t?t[0].toUpperCase():'?'};
const mark=()=>{dirty=true;const m=$('#adminMsg');if(m)m.classList.remove('ok');updateBar()};
const rerender=()=>{const y=window.scrollY;render();window.scrollTo(0,y)};

/* ---------- editing helpers ---------- */
const editBanner=()=>isAdmin?`<div class="editbanner"><span class="pen">✎</span><span>Режим разработчика: нажимай на поля с золотой пунктирной рамкой, меняй данные и жми «СОХРАНИТЬ» внизу.</span></div>`:'';
const edText=(ed,val,cls='',ph='',attrs='')=>`<span class="ed-wrap"><input class="ed ${cls}" ${attrs} data-ed="${ed}" value="${esc(val)}" placeholder="${esc(ph)}" autocomplete="off"></span>`;
const edNum=(ed,val,cls='')=>`<span class="ed-wrap ${cls==='sm'?'inl':''} ${cls==='score'?'scorew':''}"><input class="ed ${cls}" type="number" inputmode="numeric" min="0" data-ed="${ed}" value="${esc(val)}" ${cls==='score'?'placeholder="короны"':''}></span>`;
const winSelect=(ed,sel)=>`<span class="ed-wrap sel"><select class="ed wins" data-ed="${ed}">${['','0','1','2'].map(v=>`<option value="${v}" ${String(sel)===v?'selected':''}>${v===''?'—':v}</option>`).join('')}</select></span>`;
const cardSelect=(ed,sel)=>`<span class="ed-wrap sel"><select class="ed cardsel" data-ed="${ed}"><option value="">— бан —</option>${CARDS_SORTED.map(c=>`<option value="${esc(c)}" ${c===sel?'selected':''}>${esc(c)}</option>`).join('')}</select></span>`;
const playerSelect=(ed,sel)=>`<span class="ed-wrap sel"><select class="ed" data-ed="${ed}"><option value="0">— выбрать —</option>${data.players.map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(nickOf(p))}</option>`).join('')}</select></span>`;
function applyEd(el){
 const [t,a,b,c,d]=el.dataset.ed.split(':'),v=el.value;
 if(t==='p'){const p=player(a);if(!p)return;p[b]=['name','nick','favoriteCard'].includes(b)?v:Math.max(0,+v||0)}
 else if(t==='s'){const m=data.swiss[+a]?.[+b]?.pairs?.[+c];if(!m)return;if(d==='a'||d==='b')m[d]=+v;else if(/^b[ab]\d$/.test(d))m[d.slice(0,2)][+d[2]]=v;else m[d]=v}
 else if(t==='l'){const g=data.swiss[+a]?.[+b];if(g&&g.list)g.list[+c]=+v}
}
function readPhoto(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const S=360,k=Math.min(1,S/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))};img.src=fr.result};fr.readAsDataURL(file)})}
function photoEdit(p){return `<div class="photoedit"><label class="phbtn" for="ph${p.id}" title="Загрузить фото"><span class="photothumb">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initial(p.nick||p.name))}</span><span class="phpen">✎</span></label><input class="hidden" type="file" accept="image/*" id="ph${p.id}" data-photo="${p.id}">${p.photo?`<button class="phdel" type="button" data-photo-del="${p.id}" title="Убрать фото">✕</button>`:''}<span class="small">фото для рамки Эволюции</span></div>`}

/* ---------- render ---------- */
function render(){
 $('#app').innerHTML=({table:renderTable,players:renderPlayers,stats:renderStats,rating:renderRating})[activeTab]();
 document.body.classList.toggle('admin',isAdmin);
 updateBar();
}
function updateBar(){
 const el=$('#adminMsg'),bar=$('#adminBar');if(!el)return;
 bar.classList.toggle('dirty',dirty);
 if(el.classList.contains('ok'))return;
 el.textContent=dirty?'● ЕСТЬ НЕСОХРАНЁННЫЕ ИЗМЕНЕНИЯ':'✎ РЕЖИМ РАЗРАБОТЧИКА';
}
let flashT;
function flash(m){const el=$('#adminMsg');el.textContent=m;el.classList.add('ok');clearTimeout(flashT);flashT=setTimeout(()=>{el.classList.remove('ok');updateBar()},2000)}
function saveAll(){save();dirty=false;const y=window.scrollY;render();window.scrollTo(0,y);flash('✓ СОХРАНЕНО')}
function exitAdmin(){
 if(dirty){if(!confirm('Есть несохранённые изменения. Выйти без сохранения?'))return;data=load()}
 isAdmin=false;dirty=false;render();
}

/* ---------- tabs ---------- */
const plural=(n,one,few,many)=>n===1?one:(n>=2&&n<=4)?few:many;
const pn=id=>{const p=player(id);return p?esc(nickOf(p)):'—'};
function renderGroup(r,gi,g){
 const isList=Array.isArray(g.list),kind=g.kind||'';
 const tag=kind==='gold'?'ПРОШЛИ ДАЛЬШЕ':kind==='red'?'ВЫБЫЛИ':`${g.pairs.length} ${plural(g.pairs.length,'пара','пары','пар')}`;
 let body;
 if(isList){
  body=g.list.map((id,i)=>isAdmin?`<div class="listrow edit">${playerSelect(`l:${r}:${gi}:${i}`,id)}</div>`:`<div class="listrow">${pn(id)}</div>`).join('');
 }else{
  body=g.pairs.map((m,i)=>{
   if(isAdmin){
    const k=f=>`s:${r}:${gi}:${i}:${f}`;
    const side=x=>`<div class="mside">${playerSelect(k(x),m[x])}<div class="two"><div><div class="edlabel">ПОБЕДЫ</div>${winSelect(k('w'+x),m['w'+x])}</div><div><div class="edlabel">КОРОНЫ</div>${edNum(k('s'+x),m['s'+x]??'','score')}</div></div><div class="edlabel">БАНЫ</div>${[0,1,2].map(j=>cardSelect(k('b'+x+j),(m['b'+x]||[])[j]||'')).join('')}</div>`;
    return `<div class="match matchedit"><div class="mrow">${side('a')}<div class="vs">VS</div>${side('b')}</div></div>`;
   }
   const hasW=m.wa!==''&&m.wb!==''&&m.wa!=null&&m.wb!=null,w=pairWinner(m);
   const hasC=m.sa!==''&&m.sb!==''&&m.sa!=null&&m.sb!=null;
   const ba=(m.ba||[]).filter(Boolean),bb=(m.bb||[]).filter(Boolean);
   const chips=a=>a.map(n=>`<span class="chip">${esc(n)}</span>`).join('');
   return `<div class="match pair"><div class="versus"><div class="team ${w==='a'?'win':''}">${pn(m.a)}</div><div class="score ${w?'':'pending'}">${hasW?`${esc(m.wa)}:${esc(m.wb)}`:'VS'}</div><div class="team ${w==='b'?'win':''}">${pn(m.b)}</div></div>${hasC?`<div class="crownsline">корон ${esc(m.sa)} : ${esc(m.sb)}</div>`:''}${ba.length||bb.length?`<div class="banrow"><div class="banside"><div class="banlbl">БАНЫ</div><div class="chips">${chips(ba)}</div></div><div class="banside r"><div class="banlbl">БАНЫ</div><div class="chips">${chips(bb)}</div></div></div>`:''}</div>`;
  }).join('');
 }
 return `<section class="panel grp ${kind}"><div class="panelhead"><span class="rec ${/^\d:\d$/.test(g.rec)?'':'txt'}">${g.rec}</span><span class="grouptag">${tag}</span></div>${body}</section>`;
}
const chev=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="${d<0?'15 5 8 12 15 19':'9 5 16 12 9 19'}"/></svg>`;
function renderTable(){
 const last=data.swiss.length-1;
 let idx=Math.max(0,Math.min(last,+data.activeRound||0));data.activeRound=idx;
 const nav=`<div class="roundnav"><button class="rn-arrow" data-rnav="-1" aria-label="Предыдущий этап" ${idx===0?'disabled':''}>${chev(-1)}</button><div class="rn-label ${ROUND_LABELS[idx].length>11?'long':''}">${ROUND_LABELS[idx]}</div><button class="rn-arrow" data-rnav="1" aria-label="Следующий этап" ${idx===last?'disabled':''}>${chev(1)}</button></div>`;
 return title(idx<6?'ШВЕЙЦАРСКАЯ СИСТЕМА':'ПЛЕЙ-ОФФ','ТАБЛИЦА',`Этап ${idx+1} из ${last+1}`)+editBanner()+(isAdmin?'<p class="hint" style="margin:-6px 0 14px">Играем до 2 побед: счёт серии 2:0, 2:1, 1:2 или 0:2. Победы важнее корон. У каждого игрока выбери по 3 карты для бана.</p>':'')+nav+data.swiss[idx].map((g,gi)=>renderGroup(idx,gi,g)).join('');
}
function renderPlayers(){
 return title('','УЧАСТНИКИ','16 игроков')+editBanner()+`<div class="cards">${data.players.map(p=>isAdmin?
  `<article class="playercard editing">${edText(`p:${p.id}:nick`,p.nick||'','gold','Никнейм')}${edText(`p:${p.id}:name`,p.name,'','Имя')}<p>${totalWins(p.id)} побед • ${p.crowns||0} корон</p>${photoEdit(p)}</article>`:
  `<article class="playercard"><div class="nick">${esc(nickOf(p))}</div><h3>${esc(p.name)}</h3><p>${totalWins(p.id)} побед • ${p.crowns||0} корон</p></article>`).join('')}</div>`;
}

const STAT_DEFS={
 crowns:{tab:'КОРОНЫ',title:'ЛИДЕР ПО КОРОНАМ',field:'crowns',val:p=>p.crowns||0,cap:()=>'корон',row:()=>'Короны'},
 defense:{tab:'ЗАЩИТА ЗДАНИЙ',title:'ЛУЧШАЯ ЗАЩИТА ЗДАНИЙ',field:'buildingDefense',val:p=>p.buildingDefense||0,cap:()=>'защищённых зданий',row:()=>'Защита зданий'},
 card:{tab:'КАРТЫ',title:'САМАЯ ПОПУЛЯРНАЯ КАРТА',field:'cardUses',val:p=>p.cardUses||0,cap:p=>`${esc(p.favoriteCard||'—')} • использований`,row:p=>esc(p.favoriteCard||'—')}
};
const evoBox=inner=>`<div class="evo"><div class="evo-edge"></div><div class="evo-in">${inner}</div><div class="evo-glow"></div></div>`;
function evoFrame(p){return evoBox(p.photo?`<img src="${esc(p.photo)}" alt="">`:`<span class="evo-ph">${esc(initial(p.nick||p.name))}</span>`)}
const BAN_ICON='<svg viewBox="0 0 48 48" fill="none" stroke="#f1dcff" stroke-width="5" stroke-linecap="round"><circle cx="24" cy="24" r="16"/><line x1="13" y1="35" x2="35" y2="13"/></svg>';
function banCounts(){const c={};data.swiss.flat().forEach(g=>(g.pairs||[]).forEach(m=>[...(m.ba||[]),...(m.bb||[])].forEach(n=>{if(n)c[n]=(c[n]||0)+1})));return Object.entries(c).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0],'ru'))}
function banSection(full){
 const list=banCounts(),best=list[0]||['—',0],rows=list.slice(1,full?list.length:5);
 return `<section class="panel statsec"><div class="panelhead"><span>БАНЫ КАРТ</span>${full?'':`<button class="allbtn" data-stat="bans">Все ›</button>`}</div>`+
 `<div class="leader"><div class="leader-top">САМАЯ БАНИМАЯ КАРТА</div><div class="leader-body"><div class="leader-who">${evoBox(`<span class="evo-ph">${BAN_ICON}</span>`)}<div class="leader-name">${esc(best[0])}</div></div><div class="leader-val"><div class="statbig leader-num">${best[1]}</div><div class="small">банов</div></div></div></div>`+
 rows.map((r,i)=>`<div class="statline"><div class="rank">${i+2}</div><div><div class="pname">${esc(r[0])}</div><div class="small">Баны</div></div><div class="value">${r[1]}</div></div>`).join('')+
 (list.length?'':'<div class="empty">Баны пока не выбраны. Они появятся, когда вы отметите их в таблице.</div>')+
 `</section>`;
}
function statSection(key,full){
 const d=STAT_DEFS[key];
 const sorted=[...data.players].sort((a,b)=>d.val(b)-d.val(a));
 const best=sorted[0];
 const rows=sorted.slice(1,full?sorted.length:5);
 return `<section class="panel statsec"><div class="panelhead"><span>${d.tab}</span>${full?'':`<button class="allbtn" data-stat="${key}">Все ›</button>`}</div>`+
 `<div class="leader"><div class="leader-top">${d.title}</div><div class="leader-body"><div class="leader-who">${evoFrame(best)}<div class="leader-name">${esc(nickOf(best))}</div></div><div class="leader-val"><div class="statbig leader-num">${d.val(best)}</div><div class="small">${d.cap(best)}</div></div></div></div>`+
 rows.map((p,i)=>`<div class="statline"><div class="rank">${i+2}</div><div><div class="pname">${esc(nickOf(p))}</div><div class="small">${d.row(p)}</div></div><div class="value">${d.val(p)}</div></div>`).join('')+
 `</section>`;
}
function adminStatSection(key){
 const d=STAT_DEFS[key];
 return `<section class="panel statsec"><div class="panelhead"><span>${d.tab}</span><span style="color:#ffe36a">✎ ИЗМЕНИТЬ</span></div>`+
 data.players.map(p=>`<div class="statline edrow"><div><div class="pname">${esc(nickOf(p))}</div><div class="small">${esc(p.name)}</div></div>${key==='card'?`<div class="edgroup">${edText(`p:${p.id}:favoriteCard`,p.favoriteCard||'','','Карта','list="cardlist"')}${edNum(`p:${p.id}:cardUses`,p.cardUses||0)}</div>`:`<div class="edgroup narrow">${edNum(`p:${p.id}:${d.field}`,d.val(p))}</div>`}</div>`).join('')+
 `</section>`;
}
function renderStats(){
 const view=data.statsView||'all';
 const keys=view==='all'?['crowns','defense','card','bans']:[view];
 const tabs=[['all','ВСЕ'],['crowns','КОРОНЫ'],['defense','ЗАЩИТА'],['card','КАРТЫ'],['bans','БАНЫ']];
 return title('РЕЙТИНГ ИГРОКОВ','СТАТИСТИКА','Авторасчёт')+editBanner()+`<div class="subtabs">${tabs.map(([k,v])=>`<button data-stat="${k}" class="${k===view?'active':''}">${v}</button>`).join('')}</div>`+keys.map(k=>k==='bans'?banSection(view!=='all'):isAdmin?adminStatSection(k):statSection(k,view!=='all')).join('')+(isAdmin&&keys.includes('card')?`<datalist id="cardlist">${CARDS_SORTED.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`:'');
}
function adminSettings(){
 return `<section class="panel" style="margin-top:18px"><div class="panelhead"><span>НАСТРОЙКИ РАЗРАБОТЧИКА</span></div><div class="settingsbody"><div class="edlabel">НОВЫЙ КОД РАЗРАБОТЧИКА</div><span class="ed-wrap"><input class="ed" id="newpin" type="password" placeholder="Минимум 4 символа" autocomplete="new-password"></span><div class="actions"><button class="secondary" id="savepin">ИЗМЕНИТЬ КОД</button><button class="secondary" id="export">ЭКСПОРТ JSON</button><label class="secondary" for="importfile">ИМПОРТ JSON</label><input class="hidden" id="importfile" type="file" accept="application/json"></div><p class="hint">Данные хранятся в браузере. Для синхронизации между устройствами понадобится серверная база данных. Код доступа в статическом сайте не является полноценной защитой.</p></div></section>`;
}
function renderRating(){
 if(isAdmin)return title('ИСТОРИЯ СОРЕВНОВАНИЯ','РЕЙТИНГ','16 игроков')+editBanner()+`<section class="panel tablewrap"><table class="ratingtable"><thead><tr><th>#</th><th>ИГРОК</th><th>СЕЗОН</th><th>ВСЕГО</th></tr></thead><tbody>${data.players.map(p=>`<tr><td>${p.id}</td><td><b>${esc(nickOf(p))}</b></td><td>${edNum(`p:${p.id}:season`,p.season,'sm')}</td><td>${edNum(`p:${p.id}:total`,p.total,'sm')}</td></tr>`).join('')}</tbody></table></section>`+adminSettings();
 let arr=[...data.players].sort((a,b)=>b.season-a.season||b.total-a.total);
 return title('ИСТОРИЯ СОРЕВНОВАНИЯ','РЕЙТИНГ','16 игроков')+`<section class="panel tablewrap"><table class="ratingtable"><thead><tr><th>#</th><th>ИГРОК</th><th>СЕЗОН</th><th>ВСЕГО</th></tr></thead><tbody>${arr.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(nickOf(p))}</b></td><td><strong>${p.season}</strong></td><td><strong>${p.total}</strong></td></tr>`).join('')}</tbody></table></section><p class="hint">Очки за текущий сезон и общая сумма редактируются в режиме разработчика.</p>`;
}

/* ---------- events ---------- */
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
const app=$('#app');
const onEdit=e=>{const el=e.target;if(!isAdmin||!el.dataset||!el.dataset.ed)return;applyEd(el);mark()};
app.addEventListener('input',onEdit);
app.addEventListener('change',async e=>{
 const el=e.target;if(!isAdmin)return;
 if(el.dataset&&el.dataset.photo){const f=el.files[0];if(!f)return;try{const url=await readPhoto(f);player(el.dataset.photo).photo=url;mark();rerender()}catch{alert('Не удалось загрузить фото')}return}
 if(el.id==='importfile'){try{const f=el.files[0];if(!f)return;const obj=JSON.parse(await f.text());if(!obj.players)throw Error();data=ensure(obj);save();dirty=false;render();alert('Данные импортированы')}catch{alert('Не удалось прочитать резервную копию')}return}
 onEdit(e);
});
app.addEventListener('click',e=>{
 const t=e.target;
 const rn=t.closest('[data-rnav]'),s=t.closest('[data-stat]');
 if(rn&&!rn.disabled){data.activeRound=(+data.activeRound||0)+(+rn.dataset.rnav);render();window.scrollTo({top:0,behavior:'smooth'})}
 if(s){data.statsView=s.dataset.stat;render();window.scrollTo({top:0,behavior:'smooth'})}
 if(!isAdmin)return;
 const pd=t.closest('[data-photo-del]');
 if(pd){player(pd.dataset.photoDel).photo='';mark();rerender();return}
 if(t.closest('#savepin')){const v=$('#newpin').value;if(v.length<4)return alert('Минимум 4 символа');localStorage.setItem('clashDevPin',v);$('#newpin').value='';alert('Код изменён');return}
 if(t.closest('#export')){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clash-league-backup.json';a.click();URL.revokeObjectURL(a.href)}
});
$('#adminSave').onclick=saveAll;
$('#adminExit').onclick=exitAdmin;
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#loginBtn').onclick=()=>{
 if(isAdmin){exitAdmin();return}
 openModal(`<h2>Режим разработчика</h2><p class="hint">Введите секретный код для включения редактирования прямо на странице.</p><div class="field"><label>КОД ДОСТУПА</label><input id="pin" type="password" inputmode="numeric" placeholder="Код разработчика"></div><div class="actions"><button class="primary" id="unlock">ВОЙТИ</button><button class="secondary" id="cancel">ОТМЕНА</button></div>`);
 $('#cancel').onclick=closeModal;
 $('#unlock').onclick=()=>{if($('#pin').value===localStorage.getItem('clashDevPin')||(!localStorage.getItem('clashDevPin')&&$('#pin').value==='2468')){isAdmin=true;dirty=false;closeModal();render()}else alert('Неверный код')}
};
render();
</script>
</body>
</html>
