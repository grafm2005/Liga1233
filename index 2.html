<style>
:root{--bg:#070a0c;--panel:#111720;--panel2:#0b1015;--line:#252e39;--muted:#91a0b4;--text:#f5f7fa;--lime:#c6ff00;--lime2:#91c900;--red:#ff405d;--blue:#2d9cff;--gold:#ffc83d}

.brand{max-width:1050px;margin:auto;display:flex;align-items:center;gap:13px}.logo{width:54px;height:54px;border-radius:17px;background:var(--lime);color:#090d08;display:grid;place-items:center;font-size:29px;font-weight:1000;box-shadow:0 0 28px #c6ff0030}.brandname{font-size:23px;font-weight:1000;line-height:1.02;letter-spacing:-.8px}.sub{color:var(--muted);font-size:13px;margin-top:6px}.topright{margin-left:auto;display:flex;align-items:center;gap:8px}.pill{border:1px solid #37431b;color:var(--lime);background:#1c290c;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:900}
main{max-width:1050px;margin:auto;padding:28px 18px 110px}.eyebrow{color:var(--lime);font-size:12px;letter-spacing:4px;font-weight:900;text-transform:uppercase;margin-bottom:8px}.heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}.heading h1{font-size:clamp(27px,5vw,42px);letter-spacing:-1.5px;line-height:1;margin:0;font-weight:1000}.count{color:var(--muted);font-size:14px;white-space:nowrap}
.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#090d12f5;border-top:1px solid #28313a;backdrop-filter:blur(16px);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px}.nav button{flex:1;max-width:220px;border:1px solid transparent;background:transparent;color:#718198;border-radius:18px;padding:9px 4px 8px;font-weight:900;font-size:10px;letter-spacing:1px}.nav .ico{display:block;font-size:22px;margin-bottom:5px}.nav button.active{color:var(--lime);background:#202c0d;border-color:#5e8000;box-shadow:inset 0 0 0 1px #344900}
.panel{background:linear-gradient(145deg,#151d28,#0c1118);border:1px solid #27313d;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px #0004}.panelhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:1.5px}
.rows{display:flex;flex-direction:column}.rowitem{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 17px;border-bottom:1px solid #252e38}.rowitem:last-child{border-bottom:0}.rank{width:30px;height:30px;border-radius:10px;background:#303944;display:grid;place-items:center;font-weight:1000}.rowitem:first-child .rank{background:var(--lime);color:#101500}.pname{font-weight:850;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.small{font-size:12px;color:var(--muted);margin-top:4px}.points{color:var(--lime);font-size:21px;font-weight:1000;text-align:right}
.stagebar,.subtabs{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;scrollbar-width:none}.stagebar button,.subtabs button{white-space:nowrap;border:1px solid #303a46;border-radius:12px;background:#111821;color:#9aa8ba;padding:10px 14px;font-weight:900;font-size:12px}.stagebar button.active,.subtabs button.active{background:var(--lime);border-color:var(--lime);color:#111600}
.match{padding:15px 16px;border-bottom:1px solid #252e38}.match:last-child{border:0}.matchtop{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:900;margin-bottom:12px}.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.versus .team:last-child{text-align:right}.team{font-weight:850;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{background:#c6ff00;color:#101500;border-radius:99px;padding:8px 13px;font-weight:1000;min-width:64px;text-align:center}.pending{background:#202833;color:#dbe2eb}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.playercard{padding:16px;border-radius:19px;background:repeating-linear-gradient(135deg,#131c22 0,#131c22 12px,#10171d 12px,#10171d 24px);border:1px solid #2a343e;min-height:100px}.playercard .num{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:1px}.playercard h3{font-size:17px;margin:8px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.playercard p{color:var(--muted);font-size:12px;margin:0}
.statbig{font-size:30px;color:var(--lime);font-weight:1000}.statline{padding:15px 17px;border-bottom:1px solid #252e38;display:flex;align-items:center;gap:12px}.statline:last-child{border:0}.statline .value{margin-left:auto;color:var(--lime);font-size:20px;font-weight:1000}
.tablewrap{overflow:auto}.ratingtable{width:100%;border-collapse:collapse;min-width:520px}.ratingtable th,.ratingtable td{padding:14px 12px;text-align:right;border-bottom:1px solid #28313b;font-size:13px}.ratingtable th{color:var(--muted);font-size:10px;letter-spacing:1px}.ratingtable th:nth-child(2),.ratingtable td:nth-child(2){text-align:left}.ratingtable td strong{color:var(--lime);font-size:17px}

.adminbtn{border:1px solid #36414d;background:#121921;color:#d7e0eb;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:900}.adminbtn:hover{border-color:var(--lime);color:var(--lime)}

@media(min-width:700px){main{padding-top:38px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{position:sticky;top:86px;bottom:auto;border:0;background:transparent;backdrop-filter:none;padding:0 18px 12px;max-width:1050px;margin:auto}.nav button{max-width:none}.top{position:sticky}.modal{align-items:center}}
@media(max-width:380px){.brandname{font-size:19px}.logo{width:48px;height:48px}.topright .pill{display:none}.rowitem{padding:13px 12px}}

<body>
<header class="top"><div class="brand"><div class="logo">♛</div><div><div class="brandname">CLASH<br>LEAGUE</div><div class="sub">16 игроков • Турнир 2026</div></div><div class="topright"><span class="pill">CLASH ROYALE</span><button class="adminbtn" id="loginBtn">⚙ РАЗРАБОТЧИК</button></div></div></header>
<nav class="nav" id="nav">
<button class="active" data-tab="table"><span class="ico">☷</span>ТАБЛИЦА</button>
<button data-tab="players"><span class="ico">♟</span>УЧАСТНИКИ</button>
<button data-tab="stats"><span class="ico">▥</span>СТАТИСТИКА</button>
<button data-tab="rating"><span class="ico">♛</span>РЕЙТИНГ</button>
</nav>
<main id="app"></main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='clashLeagueDataV1';
const defaults=()=>({season:'Сезон 2026',players:Array.from({length:16},(_,i)=>({id:i+1,name:`Игрок ${i+1}`,season:0,total:0,crowns:0,buildingDefense:0,favoriteCard:'—',cardUses:0})),rounds:Array.from({length:5},(_,i)=>({name:`Раунд ${i+1}`,matches:[]})),activeRound:0,statsTab:'crowns'});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}
let isAdmin=false,activeTab='table';
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const player=id=>data.players.find(p=>p.id===Number(id));
const totalWins=id=>data.rounds.flatMap(r=>r.matches).filter(m=>(m.a==id&&Number(m.sa)>Number(m.sb))||(m.b==id&&Number(m.sb)>Number(m.sa))).length;
function standings(roundIndex){let ids=data.players.map(p=>p.id);let rows=ids.map(id=>({id,pts:0,w:0,l:0,draw:0,crowns:0,for:0,against:0}));let played=data.rounds.slice(0,roundIndex+1).flatMap(r=>r.matches);played.forEach(m=>{if(m.sa===''||m.sb===''||m.sa==null||m.sb==null)return;let a=rows.find(x=>x.id==m.a),b=rows.find(x=>x.id==m.b);if(!a||!b)return;let x=+m.sa,y=+m.sb;a.for+=x;a.against+=y;b.for+=y;b.against+=x;if(x>y){a.w++;a.pts+=3;b.l++}else if(y>x){b.w++;b.pts+=3;a.l++}else{a.draw++;b.draw++;a.pts++;b.pts++}});return rows.sort((a,b)=>b.pts-a.pts||(b.for-b.against)-(a.for-a.against)||b.for-a.for)}
function title(eyebrow,heading,right=''){return `<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${heading}</h1></div><div class="count">${right}</div></div>`}
function render(){let root=$('#app');if(activeTab==='table')root.innerHTML=renderTable();if(activeTab==='players')root.innerHTML=renderPlayers();if(activeTab==='stats')root.innerHTML=renderStats();if(activeTab==='rating')root.innerHTML=renderRating()}
function renderTable(){let idx=data.activeRound||0,r=data.rounds[idx];let standingsRows=standings(idx);return title('ШВЕЙЦАРСКАЯ СИСТЕМА','ТАБЛИЦА',`Раунд ${idx+1} из ${data.rounds.length}`)+`<div class="stagebar">${data.rounds.map((r,i)=>`<button class="${i===idx?'active':''}" data-round="${i}">${esc(r.name)}</button>`).join('')}</div><section class="panel"><div class="panelhead"><span>МЕСТО • ИГРОК</span><span>ОЧКИ</span></div><div class="rows">${standingsRows.map((x,i)=>`<div class="rowitem"><div class="rank">${i+1}</div><div><div class="pname">${esc(player(x.id).name)}</div><div class="small">${x.w} побед • ${x.l} поражений • ${x.for}:${x.against}</div></div><div class="points">${x.pts}</div></div>`).join('')}</div></section><div style="height:18px"></div><section class="panel"><div class="panelhead"><span>${esc(r.name).toUpperCase()} • МАТЧИ</span><span>${r.matches.length} матч.</span></div>${r.matches.length?r.matches.map((m,i)=>`<div class="match"><div class="matchtop"><span>МАТЧ ${i+1}</span><span>${m.sa===''||m.sb===''?'ОЖИДАЕТСЯ':'ЗАВЕРШЁН'}</span></div><div class="versus"><div class="team">${esc(player(m.a)?.name||'Игрок')}</div><div class="score ${m.sa===''||m.sb===''?'pending':''}">${m.sa===''||m.sb===''?'VS':`${esc(m.sa)}:${esc(m.sb)}`}</div><div class="team">${esc(player(m.b)?.name||'Игрок')}</div></div></div>`).join(''):'<div class="empty">Матчи этого раунда пока не добавлены.</div>'}</section>`}
function renderPlayers(){return title('СОСТАВ ТУРНИРА','УЧАСТНИКИ','16 игроков')+`<div class="cards">${data.players.map(p=>`<article class="playercard"><div class="num">УЧАСТНИК ${String(p.id).padStart(2,'0')}</div><h3>${esc(p.name)}</h3><p>${totalWins(p.id)} побед • ${p.crowns} корон</p></article>`).join('')}</div>`}
function renderStats(){let key=data.statsTab||'crowns';let labels={crowns:'ЛИДЕР ПО КОРОНАМ',defense:'ЛУЧШАЯ ЗАЩИТА ЗДАНИЙ',card:'САМАЯ ПОПУЛЯРНАЯ КАРТА'};let sorted=[...data.players].sort((a,b)=>key==='crowns'?b.crowns-a.crowns:key==='defense'?b.buildingDefense-a.buildingDefense:b.cardUses-a.cardUses);let best=sorted[0];let value=key==='crowns'?best.crowns:key==='defense'?best.buildingDefense:best.cardUses;return title('РЕЙТИНГ ИГРОКОВ','СТАТИСТИКА','Авторасчёт')+`<div class="subtabs">${[['crowns','КOРОНЫ'],['defense','ЗАЩИТА'],['card','КАРТЫ']].map(([k,v])=>`<button data-stat="${k}" class="${k===key?'active':''}">${v}</button>`).join('')}</div><section class="panel"><div class="panelhead"><span>${labels[key]}</span><span>ЛИДЕР</span></div><div class="statline"><div><div class="small">1 МЕСТО • ${esc(best.name)}</div><div class="statbig">${key==='card'?esc(best.favoriteCard):value}</div><div class="small">${key==='crowns'?'корон':key==='defense'?'защищённых зданий':`${value} использований`}</div></div><div class="value">${key==='card'?value+'×':'🏆'}</div></div>${sorted.map((p,i)=>`<div class="statline"><div class="rank">${i+1}</div><div><div class="pname">${esc(p.name)}</div><div class="small">${key==='card'?esc(p.favoriteCard):key==='crowns'?'Короны':'Защита зданий'}</div></div><div class="value">${key==='card'?p.cardUses:key==='crowns'?p.crowns:p.buildingDefense}</div></div>`).join('')}</section>`}
function renderRating(){let arr=[...data.players].sort((a,b)=>b.season-a.season||b.total-a.total);return title('ИСТОРИЯ СОРЕВНОВАНИЯ','РЕЙТИНГ','16 игроков')+`<section class="panel tablewrap"><table class="ratingtable"><thead><tr><th>#</th><th>ИГРОК</th><th>СЕЗОН</th><th>ВСЕГО</th></tr></thead><tbody>${arr.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.name)}</b></td><td><strong>${p.season}</strong></td><td><strong>${p.total}</strong></td></tr>`).join('')}</tbody></table></section><p class="hint">Очки за текущий сезон и общая сумма редактируются в режиме разработчика.</p>`}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('#app').addEventListener('click',e=>{let r=e.target.closest('[data-round]'),s=e.target.closest('[data-stat]');if(r){data.activeRound=+r.dataset.round;save();render()}if(s){data.statsTab=s.dataset.stat;render()}});
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#loginBtn').onclick=()=>{if(isAdmin){adminPanel();return}openModal(`<h2>Режим разработчика</h2><p class="hint">Введите секретный код, чтобы редактировать турнир.</p><div class="field"><label>КОД ДОСТУПА</label><input id="pin" type="password" inputmode="numeric" placeholder="Код разработчика"></div><div class="actions"><button class="primary" id="unlock">ВОЙТИ</button><button class="secondary" id="cancel">ОТМЕНА</button></div>`);$('#cancel').onclick=closeModal;$('#unlock').onclick=()=>{if($('#pin').value===localStorage.getItem('clashDevPin')||(!localStorage.getItem('clashDevPin')&&$('#pin').value==='2468')){isAdmin=true;closeModal();adminPanel()}else alert('Неверный код')}}
function adminPanel(){openModal(`<h2>⚙ Режим разработчика</h2><p class="hint">Изменения сохраняются в этом браузере. Настройки и результаты можно экспортировать в файл резервной копии.</p><div class="actions"><button class="primary" id="editPlayers">УЧАСТНИКИ И РЕЙТИНГ</button><button class="secondary" id="editRounds">РАУНДЫ И МАТЧИ</button><button class="secondary" id="editStats">СТАТИСТИКА</button></div><div class="adminsection"><h3>Безопасность</h3><div class="field"><label>УСТАНОВИТЬ НОВЫЙ КОД РАЗРАБОТЧИКА</label><input id="newpin" type="password" placeholder="Новый код"></div><div class="actions"><button class="secondary" id="savepin">СОХРАНИТЬ КОД</button><button class="secondary" id="export">ЭКСПОРТ JSON</button><label class="secondary" for="importfile">ИМПОРТ JSON</label><input class="hidden" id="importfile" type="file" accept="application/json"></div></div><div class="actions"><button class="secondary" id="logout">ВЫЙТИ ИЗ РЕЖИМА</button><button class="secondary" id="close">ЗАКРЫТЬ</button></div><p class="hint">Важно: код в статическом GitHub Pages не является настоящей защитой — исходный код сайта доступен посетителям. Не используй этот режим для секретных или критичных данных.</p>`);$('#close').onclick=closeModal;$('#logout').onclick=()=>{isAdmin=false;closeModal()};$('#editPlayers').onclick=editPlayers;$('#editRounds').onclick=editRounds;$('#editStats').onclick=editStats;$('#savepin').onclick=()=>{if($('#newpin').value.length<4)return alert('Минимум 4 символа');localStorage.setItem('clashDevPin',$('#newpin').value);alert('Код изменён')};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clash-league-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#importfile').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());if(!obj.players||!obj.rounds)throw Error();data=obj;save();closeModal();render();alert('Данные импортированы')}catch{alert('Не удалось прочитать резервную копию')}}}
function editPlayers(){openModal(`<h2>Участники и рейтинг</h2><p class="hint">Измените имена, очки текущего сезона и общий рейтинг.</p><div id="playeredit">${data.players.map(p=>`<div class="adminsection"><b>Игрок ${p.id}</b><div class="formgrid"><div class="field"><label>Имя</label><input data-p="${p.id}" data-k="name" value="${esc(p.name)}"></div><div class="field"><label>Очки сезона</label><input type="number" data-p="${p.id}" data-k="season" value="${p.season}"></div><div class="field"><label>Всего за историю</label><input type="number" data-p="${p.id}" data-k="total" value="${p.total}"></div></div></div>`).join('')}</div><div class="actions"><button class="primary" id="saveplayers">СОХРАНИТЬ</button><button class="secondary" id="back">НАЗАД</button></div>`);$('#back').onclick=adminPanel;$('#saveplayers').onclick=()=>{document.querySelectorAll('[data-p]').forEach(i=>{let p=player(i.dataset.p);p[i.dataset.k]=i.dataset.k==='name'?i.value:Math.max(0,+i.value||0)});save();closeModal();render()}}
function editRounds(){openModal(`<h2>Раунды и матчи</h2><div class="field"><label>ВЫБЕРИТЕ РАУНД</label><select id="roundselect">${data.rounds.map((r,i)=>`<option value="${i}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>НАЗВАНИЕ РАУНДА</label><input id="roundname" value="${esc(data.rounds[0].name)}"></div><div id="matches"></div><div class="actions"><button class="secondary" id="addmatch">+ ДОБАВИТЬ МАТЧ</button><button class="primary" id="saverounds">СОХРАНИТЬ РАУНД</button><button class="secondary" id="back">НАЗАД</button></div><p class="hint">Счёт вводится в коронах. Победа = 3 очка, ничья = 1, поражение = 0. Пары участников назначаются вручную.</p>`);let idx=0;function load(){idx=+$('#roundselect').value;$('#roundname').value=data.rounds[idx].name;draw()}function draw(){$('#matches').innerHTML=data.rounds[idx].matches.map((m,i)=>matchEditor(m,i)).join('')}function matchEditor(m,i){return `<div class="adminsection formgrid"><div class="field"><label>ИГРОК 1</label><select data-m="${i}" data-k="a">${playerOptions(m.a)}</select></div><div class="field"><label>ИГРОК 2</label><select data-m="${i}" data-k="b">${playerOptions(m.b)}</select></div><div class="field"><label>КОРОНЫ 1</label><input type="number" min="0" data-m="${i}" data-k="sa" value="${m.sa}"></div><div class="field"><label>КОРОНЫ 2</label><input type="number" min="0" data-m="${i}" data-k="sb" value="${m.sb}"></div><button class="secondary danger" data-del="${i}">УДАЛИТЬ МАТЧ</button></div>`}function playerOptions(v){return data.players.map(p=>`<option value="${p.id}" ${p.id==v?'selected':''}>${esc(p.name)}</option>`).join('')}$('#roundselect').onchange=load;$('#addmatch').onclick=()=>{data.rounds[idx].matches.push({a:1,b:2,sa:'',sb:''});draw()};$('#matches').addEventListener('click',e=>{let d=e.target.closest('[data-del]');if(d){data.rounds[idx].matches.splice(+d.dataset.del,1);draw()}});$('#saverounds').onclick=()=>{data.rounds[idx].name=$('#roundname').value;$('#matches').querySelectorAll('[data-m]').forEach(el=>{let m=data.rounds[idx].matches[+el.dataset.m];m[el.dataset.k]=['a','b'].includes(el.dataset.k)?+el.value:el.value});save();closeModal();render()};$('#back').onclick=adminPanel;draw()}
function editStats(){openModal(`<h2>Статистика игроков</h2><p class="hint">Заполняйте показатели вручную после матчей. Для карты укажите название и число использований.</p>${data.players.map(p=>`<div class="adminsection"><b>${esc(p.name)}</b><div class="formgrid"><div class="field"><label>КОРОНЫ</label><input type="number" min="0" data-statp="${p.id}" data-k="crowns" value="${p.crowns}"></div><div class="field"><label>ЗАЩИЩЁННЫЕ ЗДАНИЯ</label><input type="number" min="0" data-statp="${p.id}" data-k="buildingDefense" value="${p.buildingDefense}"></div><div class="field"><label>САМАЯ ИСПОЛЬЗУЕМАЯ КАРТА</label><input data-statp="${p.id}" data-k="favoriteCard" value="${esc(p.favoriteCard)}"></div><div class="field"><label>КОЛИЧЕСТВО ИСПОЛЬЗОВАНИЙ</label><input type="number" min="0" data-statp="${p.id}" data-k="cardUses" value="${p.cardUses}"></div></div></div>`).join('')}<div class="actions"><button class="primary" id="savestats">СОХРАНИТЬ</button><button class="secondary" id="back">НАЗАД</button></div>`);$('#back').onclick=adminPanel;$('#savestats').onclick=()=>{document.querySelectorAll('[data-statp]').forEach(i=>{let p=player(i.dataset.statp);p[i.dataset.k]=['favoriteCard'].includes(i.dataset.k)?i.value:Math.max(0,+i.value||0)});save();closeModal();render()}}
render();
</script>
</body>
</html>
